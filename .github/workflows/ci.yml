name: Go CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test -mod=readonly ./...
      - run: go vet ./...
      - run: go build ./cmd/opspilot
